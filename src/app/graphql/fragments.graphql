fragment User on UserObjectType {
  id
  name
  email
  avatarUrl
  storageLimit
  storageUsed
}

fragment ShallowDrawing on DrawingObjectType {
  id
  name
  parentFolderId
  fileSize
  savedAt
  updatedAt
}

fragment Drawing on DrawingObjectType {
  ...ShallowDrawing
  content
}

fragment Folder on FolderObjectType {
  id
  name
  parentFolderId
}
