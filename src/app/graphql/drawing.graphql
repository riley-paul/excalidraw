query GetDrawings($query: DrawingsQueryArgs) {
  drawings(query: $query) {
    ...ShallowDrawing
  }
}

query GetDrawing($drawingId: ID!) {
  drawing(drawingId: $drawingId) {
    ...Drawing
  }
}

mutation CreateDrawing($input: CreateDrawingInput!) {
  createDrawing(input: $input) {
    ...Drawing
  }
}

mutation UpdateDrawing($drawingId: ID!, $input: UpdateDrawingInput!) {
  updateDrawing(drawingId: $drawingId, input: $input) {
    ...ShallowDrawing
  }
}

mutation DeleteDrawing($drawingId: ID!) {
  deleteDrawing(drawingId: $drawingId) {
    ...ShallowDrawing
  }
}

mutation DuplicateDrawing($drawingId: ID!) {
  duplicateDrawing(drawingId: $drawingId) {
    ...Drawing
  }
}
